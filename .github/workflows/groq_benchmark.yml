name: Groq News Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Groq benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import requests

          INPUT_FILE = "test_news.json"
          OUTPUT_FILE = "groq_benchmark_results.json"

          API_URL = "https://api.groq.com/openai/v1/chat/completions"
          MODEL = "openai/gpt-oss-120b"

          with open(INPUT_FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          articles = data["articles"]

          prompt_template = """
          You are an editor for a high-quality Persian daily news briefing.

          Analyze the following news article.

          Your task is NOT to add outside information. Use only the information provided
          in the article. Clearly distinguish reported facts from claims, opinions,
          predictions, and statements attributed to people or organizations.

          Return valid JSON with exactly these fields:

          {
            "importance": 1-5,
            "importance_reason": "...",
            "category": "...",
            "summary_fa": "...",
            "key_facts": ["...", "..."],
            "claims_or_opinions": ["...", "..."],
            "sources_mentioned": ["...", "..."],
            "is_potentially_duplicate": true/false,
            "uncertainties": ["...", "..."]
          }

          Rules:
          - Write all explanatory text in natural, concise Persian.
          - Do not invent facts.
          - Do not turn an attributed claim into an established fact.
          - Do not make political recommendations or political judgments.
          - If information is insufficient, explicitly say so.
          - importance means importance for a general Persian-speaking daily-news audience,
            not whether the event is good or bad.
          - Keep summary_fa to 3-5 sentences.
          - Return JSON only.

          ARTICLE:
          """

          results = []

          for article in articles:
              article_id = article.get("id", "unknown")
              article_text = article.get("content", "")

              prompt = prompt_template + "\n" + article_text

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.1,
                  "response_format": {
                      "type": "json_object"
                  }
              }

              headers = {
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json"
              }

              success = False

              for attempt in range(5):
                  try:
                      response = requests.post(
                          API_URL,
                          headers=headers,
                          json=payload,
                          timeout=120
                      )

                      if response.status_code == 429:
                          wait_time = 10 * (attempt + 1)
                          print(
                              f"Rate limit for {article_id}. "
                              f"Waiting {wait_time} seconds before retry..."
                          )
                          time.sleep(wait_time)
                          continue

                      response.raise_for_status()

                      result = response.json()
                      content = result["choices"][0]["message"]["content"]

                      parsed = json.loads(content)

                      results.append({
                          "id": article_id,
                          "model": MODEL,
                          "result": parsed
                      })

                      print(f"Completed: {article_id}")
                      success = True
                      break

                  except Exception as e:
                      if attempt < 4:
                          wait_time = 5 * (attempt + 1)
                          print(
                              f"Error on {article_id}: {e}. "
                              f"Retrying in {wait_time} seconds..."
                          )
                          time.sleep(wait_time)
                      else:
                          print(f"Failed: {article_id}: {e}")

              # فاصله بین درخواست‌های موفق
              if success:
                  time.sleep(8)

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Saved {len(results)} results to {OUTPUT_FILE}")
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: groq-benchmark-results
          path: groq_benchmark_results.json
